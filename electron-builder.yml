# Eigenständige MAID.app für /Applications – `npm run install-app` baut und installiert sie.
appId: local.maid
productName: MAID
directories:
  output: dist
# electron-vite bündelt alles nach out/; Laufzeit-Module aus node_modules braucht die App nicht.
# Ohne asar: Der Updater liest die Build-Angaben (Contents/Resources/app/package.json) direkt aus dem ZIP.
asar: false
files:
  - out/**
  - package.json
  - '!node_modules/**'
mac:
  target: dir
  # Icon-Composer-Format (macOS 26): ein .icns setzt macOS in eine graue Kachel. Braucht Xcode 26+.
  icon: resources/MAID.icon
  category: public.app-category.productivity
  # Signiert wird danach in scripts/package.mjs – mit fester Identität, nachdem die Build-Angaben drinstehen.
  identity: null
  # Hardened Runtime ist nur für Notarisierung nötig und blockiert ad hoc signierte Frameworks.
  hardenedRuntime: false
  extendInfo:
    # Markdown ist bei macOS bekannt (net.daringfireball.markdown); MAID ist dafür ein Editor.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Markdown
        CFBundleTypeRole: Editor
        LSHandlerRank: Default
        LSItemContentTypes:
          - net.daringfireball.markdown
        CFBundleTypeExtensions:
          - md
          - markdown
      # Reiner Text: MAID steht unter „Öffnen mit“, wird aber nicht von selbst Standardprogramm.
      - CFBundleTypeName: Text
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.plain-text
        CFBundleTypeExtensions:
          - txt
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: net.daringfireball.markdown
        UTTypeDescription: Markdown
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - md
            - markdown
          public.mime-type:
            - text/markdown
